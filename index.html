<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For My Pookiee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="app-card">
        <header class="topbar">
          <div class="brand-copy">
            <span class="eyebrow">For my pookiee heheheh</span>
          </div>
        </header>

        <main>
          <section id="quizScreen" class="quiz-screen">
            <div class="progress-box">
              <div class="progress-meta">
                <span>Progress</span>
                <strong id="progressText">0%</strong>
              </div>
              <div class="progress-bar">
                <span id="progressFill"></span>
              </div>
            </div>

            <div id="questionContainer" class="question-container"></div>
          </section>

          <section id="successScreen" class="success-screen hidden">
            <div class="success-card">
              <div class="success-icon">✓</div>
                
              <p>
                Thank you my babyyyy. I love you so much, I will always be here for you, no matter what. u are my everythinggg
              </p>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
